name: PigeonPlay
options:
  bundleIdPrefix: com.pigeonplay
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The .xcodeproj is generated, so a team picked in Xcode's Signing tab is lost on
    # the next `xcodegen generate`. It has to live here. Development builds signed with
    # this team get a one-year provisioning profile instead of the free-tier seven days.
    DEVELOPMENT_TEAM: 799MU3MVGH
    CODE_SIGN_STYLE: Automatic
targets:
  PigeonPlay:
    type: application
    platform: iOS
    sources:
      - PigeonPlay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSContactsUsageDescription: "PigeonPlay uses your contacts to link parents and guardians to players on your roster."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  PigeonPlayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PigeonPlayTests
    dependencies:
      - target: PigeonPlay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
